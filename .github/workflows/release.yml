# Builds every app and publishes them as one GitHub Release:
#   Windows installer (.exe), Linux (.AppImage + .deb), Android (.apk)
# The desktop apps auto-update from these releases.
#
# Start it by pushing a version tag that matches package.json:
#   git tag v1.0.1 && git push origin v1.0.1
#
# Repository secrets used (Settings -> Secrets and variables -> Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY       (optional: without them the apps run "this device only")
#   ENOTES_KEYSTORE_BASE64, ENOTES_KEYSTORE_PASSWORD,
#   ENOTES_KEY_ALIAS, ENOTES_KEY_PASSWORD           (Android signing key)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: Linux
            os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/*.AppImage
            release/*.deb
            release/latest*.yml

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ENOTES_KEYSTORE_BASE64 }}
          ENOTES_KEYSTORE_PASSWORD: ${{ secrets.ENOTES_KEYSTORE_PASSWORD }}
          ENOTES_KEY_ALIAS: ${{ secrets.ENOTES_KEY_ALIAS }}
          ENOTES_KEY_PASSWORD: ${{ secrets.ENOTES_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF" == refs/tags/* ]] || VERSION="0.0.${GITHUB_RUN_NUMBER}"
          mkdir -p ../out
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/enotes.jks"
            export ENOTES_KEYSTORE="$RUNNER_TEMP/enotes.jks"
            ./gradlew --no-daemon assembleRelease -PversionCode=${GITHUB_RUN_NUMBER} -PversionName="$VERSION"
            cp app/build/outputs/apk/release/app-release.apk "../out/E-Notes-${VERSION}-android.apk"
          else
            echo "::warning::No signing key secrets: building a debug APK instead."
            ./gradlew --no-daemon assembleDebug -PversionCode=${GITHUB_RUN_NUMBER} -PversionName="$VERSION"
            cp app/build/outputs/apk/debug/app-debug.apk "../out/E-Notes-${VERSION}-android-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [desktop, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: E-Notes ${{ github.ref_name }}
          files: files/*
          body: |
            ## E-Notes ${{ github.ref_name }}
            Created by **Md. Towfiq Bin Hasan** and **TH team**.

            | Device | Download |
            |---|---|
            | Windows 10/11 | `E-Notes-Setup-*.exe` |
            | Linux | `E-Notes-*.AppImage` (any distro) or `E-Notes-*.deb` (Ubuntu/Debian) |
            | Android (Galaxy S25 Ultra and others) | `E-Notes-*-android.apk` |
            | Web | the GitHub Pages link in the README |

            Installed desktop apps update themselves from this page.
